name: Nightly dev to main

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test a frozen integration without creating a PR or merging
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly-dev-to-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'liang-today/dsh-liangxiang' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.snapshot.outputs.base }}
      head: ${{ steps.snapshot.outputs.head }}
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
      - id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly-promotion.mjs plan

  dry-run:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && (inputs.dry_run || vars.LIANGXIANG_PROMOTION_APP_ID == '')
    uses: ./.github/workflows/ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base }}
      head_sha: ${{ needs.plan.outputs.head }}
      full_smoke: true

  privacy-dry-run:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && (inputs.dry_run || vars.LIANGXIANG_PROMOTION_APP_ID == '')
    uses: ./.github/workflows/privacy.yml
    with:
      base_sha: ${{ needs.plan.outputs.base }}
      head_sha: ${{ needs.plan.outputs.head }}

  setup-required:
    needs: [plan, dry-run, privacy-dry-run]
    if: always() && needs.plan.outputs.changed == 'true' && !inputs.dry_run && vars.LIANGXIANG_PROMOTION_APP_ID == ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo '::error::Full checks ran in read-only mode. Install the promotion GitHub App as documented in docs/CI.md before enabling automatic merging.'
          exit 1

  promote:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && !inputs.dry_run && vars.LIANGXIANG_PROMOTION_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      # The controller comes only from trusted main, never from a PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.base }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.LIANGXIANG_PROMOTION_APP_ID }}
          private-key: ${{ secrets.LIANGXIANG_PROMOTION_APP_PRIVATE_KEY }}
          owner: liang-today
          repositories: dsh-liangxiang
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Verify a frozen dev commit, then atomically fast-forward main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: node scripts/ci/nightly-promotion.mjs promote
      - name: Clean up only this run's unchanged temporary branch
        if: always() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/ci/nightly-promotion.mjs cleanup
