name: verify

# 门禁只做一件事：跑 pnpm run verify。刻意不覆盖的三类：
# 1. tests/browser —— playwright.config.ts 在没有 LIANGXIANG_BROWSER_BASE_URL 时直接
#    throw，需要一台真跑着的 DSH WebUI，不属于 PR 门禁；
# 2. smoke:* / assert-profile-modules —— 需要真实 DSH 安装与 disposable profile；
# 3. npm publish / Release / deploy —— RELEASE_CHECKLIST.md 规定只在运营者显式下令后
#    手工执行，CI 里出现它们等于把发布动作变成提交的副作用。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # DSH 定义跑在哪个 dist-tag 上。仓库跟的是 alpha 线，矩阵每个平台都先升到这一档的
  # 最新版再跑测试；想跟 RC 线就把这里换成 next。
  #
  # 不要用 latest：npm 上 @deepseek-ai/dsh 的 latest 是 0.2.0-rc.2，但 client-ui-layout /
  # client-ui-slots 的 latest 还停在 0.0.1-rc.1（比仓库钉的版本更旧），四个包拼起来是串味
  # 的组合，还会把 layout/slots 降级。alpha 和 next 这两条线上四个包的版本号是一致的。
  DSH_DIST_TAG: alpha

jobs:
  # 三个 OS 都要跑，理由各不相同：
  # - windows：产品装进 DSH Desktop 后 host 半做真实文件系统与进程操作（file-log 的路径
  #   拼接、profile-npm-float 的 shell 分支），INSTALL.md 也给了 Windows PowerShell 步骤；
  #   这是风险面最大的平台，也是历史上唯一没被验过的平台。
  # - macos：作者本机（docs/100、docs/141 的实测环境都是 macOS），基线在这里，掉了要立刻知道。
  # - ubuntu：后端实际部署在 Rocky Linux（docs/CURRENT_ARCHITECTURE.md），glibc 上
  #   node:sqlite 与并发测试的行为要跟 glibc 目标对齐。
  #
  # 每个平台都跑 DSH 的最新定义，而不是 pnpm-lock.yaml 里钉的那一版。理由：@deepseek-ai/*
  # 全是 devDependencies，发布产物不携带它们——插件运行时解析的是宿主装的那一版 DSH，所以
  # 「最新版还能不能对上」比「锁定版还能不能对上」更接近用户实际处境。pin 是审计基线，
  # 不是对消费者的承诺；它由下面第一步的 --frozen-lockfile 继续守住一致性。
  #
  # 这一步收紧门禁的前提是 src/compat/dsh/settled-usage.ts 同时能读 0.2 的内嵌 attempt
  # stream。只把配置改成「跑最新」而没有那段兼容，main 会立刻三平台全红。
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # pnpm-lock.yaml 是 lockfileVersion 9.0（由 pnpm 10.34.5 生成）。版本漂移会让
      # --frozen-lockfile 直接失败，所以这里钉到同一个版本，而不是用 latest。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      # node:sqlite 要求 >=22.5；DSH 基线是 ^22.19.0 || >=24.0.0（docs/000）。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 先按锁文件装一遍：这一步是唯一还在校验 package.json 与 pnpm-lock.yaml 一致的地方。
      - run: pnpm install --frozen-lockfile
      # 再把 DSH 定义换到 dist-tag 上的最新一套，覆盖锁文件里的版本。
      # cordis 和 cordis-plugin-group 跟着一起升：dsh 的 alpha 线要求
      # @deepseek-ai/cordis@~4.0.5-alpha.2 与 @deepseek-ai/cordis-plugin-group@~1.0.5-alpha.2，
      # 留在 4.0.2 / 1.0.2 会留一堆 unmet peer；两者的 latest（4.0.5 / 1.0.5）都落在范围里。
      #
      # 每条命令都写成单行：matrix 里含 windows，默认 shell 是 pwsh，反斜杠续行是 bash
      # 语法，在那边会以 ParserError 直接失败。
      - name: Move the DSH definition set to the newest dist-tag
        run: |
          pnpm add -D --save-exact "@deepseek-ai/dsh@${{ env.DSH_DIST_TAG }}" "@deepseek-ai/dsh-client-ui-layout@${{ env.DSH_DIST_TAG }}" "@deepseek-ai/dsh-client-ui-renderer@${{ env.DSH_DIST_TAG }}" "@deepseek-ai/dsh-client-ui-slots@${{ env.DSH_DIST_TAG }}" "@deepseek-ai/cordis@latest" "@deepseek-ai/cordis-plugin-group@latest"
      # 把实际被测到的版本打进日志，否则红了也说不清是对哪一套红的。
      - name: Record the versions actually under test
        run: |
          pnpm ls --depth 0 @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/dsh-client-ui-layout @deepseek-ai/dsh-client-ui-renderer @deepseek-ai/dsh-client-ui-slots
      - run: pnpm run verify
