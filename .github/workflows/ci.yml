name: verify

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      full_smoke:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify-locked (${{ matrix.os }})
    if: github.repository == 'liang-today/dsh-liangxiang'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.base_sha || github.sha }}
          fetch-depth: 0
      - name: Require dev to contain main and main candidates to come from dev
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_BRANCH" = dev ]; then
            git merge-base --is-ancestor origin/main HEAD
          else
            git merge-base --is-ancestor origin/main "$PR_HEAD_SHA"
            git merge-base --is-ancestor "$PR_HEAD_SHA" origin/dev
          fi
      - name: Build the frozen integration tree for a dry run
        if: inputs.head_sha != ''
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: bash scripts/ci/merge-snapshot.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install the audited dependency set
        id: install
        run: pnpm install --frozen-lockfile
      - name: Record tested versions
        run: |
          node --version
          pnpm --version
          pnpm ls --depth 0 @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/cordis-plugin-group @deepseek-ai/dsh-client-ui-layout @deepseek-ai/dsh-client-ui-renderer @deepseek-ai/dsh-client-ui-slots
      - name: Typecheck, lint, tests, build and client budget
        id: checks
        run: |
          node --test scripts/ci/nightly-promotion.test.mjs
          pnpm run verify
      - name: Summarize the required check
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          VERIFY_RESULT: ${{ steps.checks.outcome }}
        run: |
          {
            echo "### Locked dependencies: $RUNNER_OS"
            echo "- Commit: $GITHUB_SHA"
            echo "- Install: $INSTALL_RESULT"
            echo "- Complete verification: $VERIFY_RESULT"
            echo "This job is a required merge check. It does not publish or deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke-installed
    if: github.repository == 'liang-today/dsh-liangxiang' && (inputs.full_smoke || github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.base_sha || github.sha }}
          fetch-depth: 0
      - name: Build the frozen integration tree for a dry run
        if: inputs.head_sha != ''
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: bash scripts/ci/merge-snapshot.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm exec playwright install --with-deps chromium
      - name: Packed installation and desktop, narrow, dark browser checks
        timeout-minutes: 10
        run: pnpm run smoke:browser-clean-profile
      - name: Isolated backend and Host online loop
        timeout-minutes: 10
        run: pnpm run smoke:online
