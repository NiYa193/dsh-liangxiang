# Proposal only: not installed in .github/workflows.
# The current GitHub OAuth credential lacks workflow scope; activation is deferred.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: [locked, alpha]
    runs-on: ${{ matrix.os }}
    # Upstream previews provide advance notice; the audited lockfile stays the gate.
    continue-on-error: ${{ matrix.dsh == 'alpha' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the upstream preview with one matching DSH package set
        if: matrix.dsh == 'alpha'
        shell: bash
        run: |
          dsh_version="$(pnpm view @deepseek-ai/dsh@alpha version)"
          pnpm add -D --save-exact "@deepseek-ai/dsh@$dsh_version" "@deepseek-ai/dsh-client-ui-layout@$dsh_version" "@deepseek-ai/dsh-client-ui-renderer@$dsh_version" "@deepseek-ai/dsh-client-ui-slots@$dsh_version" "@deepseek-ai/cordis@latest" "@deepseek-ai/cordis-plugin-group@latest"
      - name: Record tested versions
        run: pnpm ls --depth 0 @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/cordis-plugin-group @deepseek-ai/dsh-client-ui-layout @deepseek-ai/dsh-client-ui-renderer @deepseek-ai/dsh-client-ui-slots
      - run: pnpm run verify
